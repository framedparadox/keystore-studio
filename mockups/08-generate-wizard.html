<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock 08 — Generate Key Pair Wizard · xkeystore</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e9eef5; --ink: #0f172a; --muted: #64748b; --line: #cbd5e1;
      --accent: #0f766e; --card: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      display: grid; place-items: center; padding: 24px;
    }
    .modal {
      width: min(720px, 100%); background: var(--card);
      border: 1px solid var(--line); border-radius: 24px;
      box-shadow: 0 24px 60px rgba(15, 40, 70, .12);
      overflow: hidden;
    }
    .mh {
      padding: 22px 24px 16px; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .mh h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .mh p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .x { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: #f8fafc; font-size: 16px; cursor: pointer; }
    .steps { display: flex; gap: 8px; padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid var(--line); }
    .step {
      flex: 1; text-align: center; padding: 10px 8px; border-radius: 12px;
      font-size: 12px; font-weight: 700; color: var(--muted); background: #fff; border: 1px solid var(--line);
    }
    .step.on { background: #f0fdfa; border-color: #5eead4; color: var(--accent); }
    .step.done { color: var(--accent); }
    .body { padding: 22px 24px; }
    .algos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .algo {
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 12px; text-align: center;
      cursor: pointer; background: #fff;
    }
    .algo.on { border-color: #2dd4bf; background: #f0fdfa; box-shadow: 0 0 0 3px rgba(15,118,110,.1); }
    .algo .t { font-size: 13px; font-weight: 700; }
    .algo .d { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 650; margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px;
      padding: 0 12px; font: inherit; font-size: 13.5px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: "DM Mono", monospace; }
    .foot {
      padding: 16px 24px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; background: #f8fafc;
    }
    .btn {
      height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; font: inherit; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .btn.p { background: var(--accent); color: #fff; border-color: var(--accent); }
    @media (max-width: 640px) {
      .algos { grid-template-columns: 1fr 1fr; }
      .grid2, .grid3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="modal">
    <div class="mh">
      <div>
        <h1>Generate key pair &amp; certificate</h1>
        <p>Native Rust engine · write into production-identity.p12</p>
      </div>
      <button class="x" aria-label="Close">×</button>
    </div>
    <div class="steps">
      <div class="step done">1 · Algorithm</div>
      <div class="step on">2 · Identity</div>
      <div class="step">3 · Options</div>
      <div class="step">4 · Review</div>
    </div>
    <div class="body">
      <div class="algos">
        <div class="algo"><div class="t">RSA</div><div class="d">2048–8192</div></div>
        <div class="algo on"><div class="t">ECDSA</div><div class="d">P-256 / P-384</div></div>
        <div class="algo"><div class="t">Ed25519</div><div class="d">Curve25519</div></div>
        <div class="algo"><div class="t">ML-DSA-65</div><div class="d">FIPS 204 PQC</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Alias</label><input value="edge-ingress-tls" /></div>
        <div class="field"><label>Curve</label><select><option>secp256r1 (P-256)</option><option>secp384r1 (P-384)</option></select></div>
      </div>
      <div class="field"><label>Common Name (CN)</label><input value="ingress.xkeystore.internal" /></div>
      <div class="grid3">
        <div class="field"><label>Organization</label><input value="xkeystore Security Inc" /></div>
        <div class="field"><label>OU</label><input value="Edge Mesh" /></div>
        <div class="field"><label>Country</label><input value="US" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Validity (days)</label><input value="365" /></div>
        <div class="field"><label>Signer (optional CA)</label><select><option>xkeystore-root-ca</option><option>Self-signed</option></select></div>
      </div>
      <div class="field">
        <label>Subject Alternative Names</label>
        <input value="ingress.xkeystore.internal, *.edge.xkeystore.internal" />
        <div class="hint">DNS / IP SANs · Key Usage: Digital Signature, Key Agreement</div>
      </div>
    </div>
    <div class="foot">
      <button class="btn">← Back</button>
      <div style="display:flex;gap:8px;">
        <button class="btn">Cancel</button>
        <button class="btn p">Continue →</button>
      </div>
    </div>
  </div>
</body>
</html>
