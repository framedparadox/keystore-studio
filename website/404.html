<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Page not found — Keystore Studio</title>
    <meta name="description" content="This page doesn't exist on the Keystore Studio website." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fbfbfd" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/assets/img/favicon-64.png" />
    <script src="/assets/js/theme-init.js"></script>
    <!-- Self-contained styles: a host may serve this page at any missing path, where relative stylesheet links would break. -->
    <style>
      :root {
        color-scheme: light;
        --bg: #fbfbfd;
        --surface: #ffffff;
        --bg-2: #f5f5f7;
        --line: rgba(0, 0, 0, 0.08);
        --line-strong: rgba(0, 0, 0, 0.14);
        --ink: #1d1d1f;
        --ink-2: #424245;
        --muted: #6e6e73;
        --bad: #d92d20;
        --bad-soft: rgba(217, 45, 32, 0.12);
        --brand: #1d1d1f;
        --on-brand: #fff;
        --shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.28), 0 12px 24px -12px rgba(0, 0, 0, 0.1);
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #000;
          --surface: #0f0f10;
          --bg-2: #0b0b0c;
          --line: rgba(255, 255, 255, 0.09);
          --line-strong: rgba(255, 255, 255, 0.16);
          --ink: #f5f5f7;
          --ink-2: #d2d2d7;
          --muted: #a1a1a6;
          --bad: #f87171;
          --bad-soft: rgba(248, 113, 113, 0.14);
          --brand: #f5f5f7;
          --on-brand: #000;
          --shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #000;
        --surface: #0f0f10;
        --bg-2: #0b0b0c;
        --line: rgba(255, 255, 255, 0.09);
        --line-strong: rgba(255, 255, 255, 0.16);
        --ink: #f5f5f7;
        --ink-2: #d2d2d7;
        --muted: #a1a1a6;
        --bad: #f87171;
        --bad-soft: rgba(248, 113, 113, 0.14);
        --brand: #f5f5f7;
        --on-brand: #000;
        --shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.47 var(--font);
        letter-spacing: -0.012em;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 560px; display: grid; gap: 28px; justify-items: center; text-align: center; }
      .code {
        margin: 0;
        font-size: clamp(88px, 22vw, 168px);
        line-height: 0.9;
        font-weight: 700;
        letter-spacing: -0.06em;
        background: linear-gradient(180deg, var(--ink) 30%, color-mix(in srgb, var(--ink) 30%, transparent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); line-height: 1.12; letter-spacing: -0.028em; }
      p.lede { margin: -12px 0 0; color: var(--muted); font-size: 19px; font-weight: 500; }
      .cert {
        width: 100%;
        text-align: left;
        border-radius: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        overflow: hidden;
        animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .cert-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--bad-soft);
        color: var(--bad);
        font-size: 12px;
      }
      .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      dl { margin: 0; padding: 6px 18px 10px; }
      dl div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 9px 0; font-size: 14px; }
      dl div + div { border-top: 1px solid var(--line); }
      dt { color: var(--muted); }
      dd { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      nav a {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 16px;
        text-decoration: none;
        color: var(--ink);
        box-shadow: inset 0 0 0 1px var(--line-strong);
        transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1), background-color 160ms;
      }
      nav a:first-child { background: var(--brand); color: var(--on-brand); box-shadow: none; }
      nav a:hover { transform: translateY(-1px); }
      nav a:not(:first-child):hover { background: var(--bg-2); }
      .nf-foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 20px; margin-top: 4px; font-size: 14px; }
      .nf-foot a { color: var(--muted); text-decoration: none; }
      .nf-foot a:hover { color: var(--ink); }
      a:focus-visible { outline: 2px solid #0a66d9; outline-offset: 3px; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.98); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .cert { animation: none; } nav a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page isn't in the keystore.</h1>
      <p class="lede">The link may be old, or the address mistyped.</p>
      <div class="cert" role="img" aria-label="A certificate card for the requested page, with status: not found.">
        <div class="cert-head" aria-hidden="true"><span>Entry inspector</span><span class="status">Not found</span></div>
        <dl aria-hidden="true">
          <div><dt>Alias</dt><dd id="nf-path">/this-page</dd></div>
          <div><dt>Subject</dt><dd>CN=Page not found, O=Keystore Studio</dd></div>
          <div><dt>Status</dt><dd>HTTP 404</dd></div>
        </dl>
      </div>
      <nav aria-label="Where to go next">
        <a href="/">Home</a>
        <a href="/downloads/">Downloads</a>
        <a href="/privacy/">Privacy</a>
      </nav>
      <footer class="nf-foot" aria-label="More pages">
        <a href="/changelog/">Changelog</a>
        <a href="/feedback/">Feedback</a>
        <a href="/apps/">More apps</a>
        <a href="https://github.com/framedparadox/keystore-studio" rel="noopener">GitHub</a>
      </footer>
    </main>
    <script src="/assets/js/404.js" defer></script>
  </body>
</html>
