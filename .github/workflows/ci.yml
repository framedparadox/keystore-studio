name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (types, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    # The engine is pure Rust but the formats it reads are platform-independent only in theory:
    # path handling, the native trust store and file locking all differ, so the whole suite
    # (including keytool/openssl/jarsigner interop) runs on all three platforms.
    name: Rust engine — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise burn GitHub's 6-hour default. The suite takes ~3 minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux }
          - { os: macos-14, name: macOS (Apple silicon) }
          - { os: windows-2022, name: Windows }
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev openssl
      # macOS ships LibreSSL as `openssl`, which has no `pkcs12 -export -pbmac1_pbkdf2` and a
      # different `ts` implementation. Install real OpenSSL and put it first on PATH so the interop
      # tests exercise the same tool users have.
      - name: OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tauri-build needs the frontend bundle (frontendDist) to exist.
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Tool versions
        shell: bash
        run: |
          echo "openssl: $(openssl version)"
          echo "keytool:  $(keytool -help 2>&1 | head -1 || true)"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  lint:
    name: Lint (clippy, licences, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Advisories are informational: the database gains entries daily, and a new one against a
      # transitive crate should not block an unrelated change. Licence, source and ban checks are
      # properties of this repository's own choices, so those do fail the job.
      - name: Dependency licences, sources and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses sources bans
      - name: Dependency advisories (informational)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories

  fuzz:
    # A short smoke run on every push, to catch a parser that panics on its own seed corpus. The
    # long campaigns are run manually or on a schedule; see IMPROVEMENT.md.
    name: Fuzz parsers (smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      # libFuzzer needs the sanitizer support that only nightly ships.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/fuzz
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target briefly
        run: ./src-tauri/fuzz/run-all.sh 60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: src-tauri/fuzz/artifacts

  e2e:
    # The full user journey against the real app. Linux drives it with tauri-driver +
    # WebKitWebDriver under Xvfb; macOS and Windows have no equivalent WebDriver for their
    # webviews, so there the build is verified and the journey is Linux-only (see IMPROVEMENT.md).
    name: End-to-end (desktop app under Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb openssl
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo install tauri-driver --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle
      - name: Run the user journey
        run: xvfb-run -a -s "-screen 0 1440x900x24" node e2e/app.e2e.mjs
        env:
          XKS_SHOTS: ${{ runner.temp }}/e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-screenshots

  e2e-headless:
    # The production UI bundle in headless Chrome against the real engine (examples/ui_bridge.rs
    # calls the same engine functions as the Tauri commands). It needs no WebKit and no display,
    # so it covers what the WebDriver journey cannot reach cheaply: key locking on every path,
    # stacked dialogs, focus, undo across opened files, Save As, bulk actions. Selenium Manager
    # fetches a pinned Chrome for Testing build.
    name: End-to-end (UI in headless Chrome)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Built here so the suite's 90-second wait for the engine is not spent compiling it.
      - run: cargo build --manifest-path src-tauri/Cargo.toml --example ui_bridge --no-default-features
      - run: pnpm test:e2e:headless
        env:
          XKS_SCREENSHOTS: ${{ runner.temp }}/headless-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-screenshots
          path: ${{ runner.temp }}/headless-screenshots
          if-no-files-found: ignore

  bundle:
    # Proves the installers actually build on each platform. This is what catches a
    # platform-specific build break that `cargo test` misses, such as a missing icon format or a
    # bundler misconfiguration.
    name: Installer — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: Linux (deb), args: "--bundles deb" }
          - { os: macos-14, name: macOS (dmg), args: "--bundles dmg" }
          - { os: windows-2022, name: Windows (msi), args: "--bundles msi" }
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The bundles are unsigned: signing needs secrets this workflow deliberately does not have.
      # Without notarization macOS Gatekeeper will block the .dmg on an end user's machine; that is
      # a release concern, tracked in IMPROVEMENT.md, not a CI one.
      - run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
