name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to publish (for example v1.0.0)
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        run: pnpm tauri build --ci --bundles nsis --no-sign
      - name: Package MSIX
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RELEASE_TAG -notmatch '^v?(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$') {
            throw "Release tag '$env:RELEASE_TAG' must contain a semantic version such as v1.2.3."
          }
          $msixVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"

          $packageRoot = Join-Path $env:RUNNER_TEMP 'keystore-studio-msix'
          $assetsPath = Join-Path $packageRoot 'Assets'
          New-Item -ItemType Directory -Path $assetsPath -Force | Out-Null
          Copy-Item 'src-tauri/target/release/keystore-studio.exe' $packageRoot
          Get-ChildItem 'src-tauri/target/release' -Filter '*.dll' -File |
            Copy-Item -Destination $packageRoot
          Copy-Item 'src-tauri/icons/128x128@2x.png' (Join-Path $assetsPath 'StoreLogo.png')
          Copy-Item 'src-tauri/icons/128x128@2x.png' (Join-Path $assetsPath 'Square150x150Logo.png')
          Copy-Item 'src-tauri/icons/128x128.png' (Join-Path $assetsPath 'Square44x44Logo.png')

          $publisher = 'CN=Keystore Studio'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'msix-signing.pfx'
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)
          if ($hasCertificate) {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificatePath,
              $env:MSIX_CERTIFICATE_PASSWORD
            )
            $publisher = $certificate.Subject
          } elseif (-not [string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_PASSWORD)) {
            throw 'MSIX_CERTIFICATE_PASSWORD is set but MSIX_CERTIFICATE_BASE64 is missing.'
          }

          $manifest = Get-Content 'src-tauri/msix/AppxManifest.xml' -Raw
          $manifest = $manifest.Replace('__VERSION__', $msixVersion)
          $manifest = $manifest.Replace('__PUBLISHER__', [Security.SecurityElement]::Escape($publisher))
          [IO.File]::WriteAllText(
            (Join-Path $packageRoot 'AppxManifest.xml'),
            $manifest,
            [Text.UTF8Encoding]::new($false)
          )

          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) {
            throw 'MakeAppx.exe was not found in the installed Windows SDK.'
          }

          $outputPath = 'src-tauri/target/release/bundle/msix/KeystoreStudio_{0}_x64.msix' -f $msixVersion
          New-Item -ItemType Directory -Path (Split-Path $outputPath) -Force | Out-Null
          & $makeAppx.FullName pack /d $packageRoot /p $outputPath
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx failed with exit code $LASTEXITCODE."
          }

          if ($hasCertificate) {
            $signTool = Join-Path $makeAppx.Directory.FullName 'signtool.exe'
            if (-not (Test-Path $signTool)) {
              throw "SignTool.exe was not found at '$signTool'."
            }
            & $signTool sign /fd SHA256 /f $certificatePath /p $env:MSIX_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $outputPath
            if ($LASTEXITCODE -ne 0) {
              throw "SignTool failed with exit code $LASTEXITCODE."
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msix/*
          if-no-files-found: error

  build-macos:
    name: macOS installer
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build macOS installer
        run: pnpm tauri build --ci --bundles dmg --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-studio-macos
          path: src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error

  build-linux:
    name: Linux installers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf pkg-config
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build Linux installers
        run: pnpm tauri build --ci --bundles appimage,deb,rpm --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-studio-linux
          path: |
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/deb/*
            src-tauri/target/release/bundle/rpm/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release assets
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: keystore-studio-*
          merge-multiple: true
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msix
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
